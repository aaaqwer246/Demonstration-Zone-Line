<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示范区线 · 列车运行图</title>
<style>
  :root{
    --bg:#24262b;
    --panel:#2b2e34;
    --panel-2:#33363d;
    --line:#41444c;
    --line-soft:#3a3d44;
    --grid-major:#565a63;
    --grid-minor:#3a3d44;
    --text:#dcdbd6;
    --text-dim:#9b9c9c;
    --text-faint:#6b6d72;
    --amber:#d9a55c;
    --mono: "JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
    --sans: "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;

    --xt:#b285d9; /* 西塘 - 紫 */
    --sx:#5b8ae0; /* 水乡 - 蓝 */
    --sd:#e0a24f; /* 示范区本线 - 橙 */
    --sf:#57b07c; /* 示范到沪 - 绿 */
    --sdh:#e85c5c; /* 苏淀沪 - 红 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}

  header{
    padding:24px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; align-items:baseline; gap:14px;}
  .brand .mark{
    font-family:var(--mono); font-size:12px; letter-spacing:0.18em;
    color:var(--amber); border:1px solid var(--amber); padding:3px 8px; border-radius:2px;
  }
  h1{font-size:21px; margin:0; font-weight:600; letter-spacing:0.02em;}
  h1 small{display:block; font-family:var(--mono); font-size:11px; color:var(--text-dim); font-weight:400; letter-spacing:0.12em; margin-top:4px;}
  .meta{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:right; line-height:1.6;}

  .legend{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:12px 28px; border-bottom:1px solid var(--line-soft); background:var(--panel);
  }
  .chip{
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim);
    padding:5px 10px; border:1px solid var(--line); border-radius:3px; cursor:pointer;
    user-select:none; transition:all .12s ease; background:var(--panel-2);
  }
  .chip:hover{ color:var(--text); border-color:var(--text-faint); }
  .chip.active{ color:#fff; font-weight:600; }
  .chip .dot{width:10px;height:10px;border-radius:2px;flex:none;}
  .chip[data-p="XT"] .dot{background:var(--xt);} .chip[data-p="XT"].active{background:var(--xt); border-color:var(--xt);}
  .chip[data-p="SX"] .dot{background:var(--sx);} .chip[data-p="SX"].active{background:var(--sx); border-color:var(--sx);}
  .chip[data-p="SD"] .dot{background:var(--sd);} .chip[data-p="SD"].active{background:var(--sd); border-color:var(--sd);}
  .chip[data-p="SF"] .dot{background:var(--sf);} .chip[data-p="SF"].active{background:var(--sf); border-color:var(--sf);}
  .chip[data-p="SDH"] .dot{background:var(--sdh);} .chip[data-p="SDH"].active{background:var(--sdh); border-color:var(--sdh);}
  .chip.count{color:var(--text-faint); font-size:10px;}

  .controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 28px; border-bottom:1px solid var(--line); background:var(--bg);
  }
  .search-wrap{position:relative; flex:1; min-width:220px; max-width:320px;}
  .search-wrap input{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:13px; padding:9px 12px 9px 30px; border-radius:3px; outline:none;
    transition:border-color .12s ease;
  }
  .search-wrap input:focus{border-color:var(--amber);}
  .search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:0.45;}
  .toggle{
    display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim);
    cursor:pointer; user-select:none;
  }
  .toggle .switch{
    width:30px; height:16px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    position:relative; transition:all .15s ease;
  }
  .toggle .switch::after{
    content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:var(--text-faint);
    top:1px; left:2px; transition:all .15s ease;
  }
  .toggle input{display:none;}
  .toggle input:checked + .switch{background:rgba(217,165,92,0.18); border-color:var(--amber);}
  .toggle input:checked + .switch::after{background:var(--amber); left:15px;}
  .hint{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-left:auto;}

  .stage{
    position:relative;
    overflow:auto;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  svg{ display:block; }
  .station-label{ font-family:var(--sans); font-size:12px; fill:var(--text-dim); }
  .station-line{ stroke:var(--grid-major); stroke-width:1; }
  .hour-line{ stroke:var(--grid-major); stroke-width:1; }
  .min-line{ stroke:var(--grid-minor); stroke-width:1; }
  .hour-label{ font-family:var(--mono); font-size:11px; fill:var(--text-dim); }
  .train-path{ fill:none; stroke-width:1.6; cursor:pointer; transition:opacity .12s ease, stroke-width .12s ease; }
  .train-path:hover{ stroke-width:3; }
  .train-path.faded{ opacity:0.08; }
  .train-path.hidden-cat{ display:none; }
  .train-hit{ fill:none; stroke:transparent; stroke-width:9; cursor:pointer; }

  #tooltip{
    position:fixed; pointer-events:none; z-index:50;
    background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    padding:8px 11px; font-family:var(--mono); font-size:11.5px; color:var(--text);
    line-height:1.7; box-shadow:0 6px 18px rgba(0,0,0,0.35); display:none; white-space:nowrap;
  }
  #tooltip b{ color:var(--amber); }

  footer{
    padding:16px 28px 34px; color:var(--text-faint);
    font-family:var(--mono); font-size:10.5px; border-top:1px solid var(--line-soft); line-height:1.8;
  }

  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  @media (max-width: 780px){
    header,.legend,.controls,footer{padding-left:16px; padding-right:16px;}
    .hint{display:none;}
  }
</style>
</head>

const stations = DATA.stations;
const trains = DATA.trains;

const prefixColorVar = {XT:'--xt', SX:'--sx', SD:'--sd', SF:'--sf', SDH:'--sdh'};
const prefixFull = {XT:'西塘贯通示范', SX:'水乡贯通示范', SD:'示范区本线', SF:'示范区到沪', SDH:'苏淀沪线'};

// ---- layout constants ----
const MARGIN_L = 130, MARGIN_R = 40, MARGIN_T = 30, MARGIN_B = 30;
const PX_PER_MIN = 7;
const KM_TOTAL = stations[stations.length-1].km;
const PX_PER_KM = 13;

let allMin = Infinity, allMax = -Infinity;
trains.forEach(t => t.stops.forEach(s => { allMin = Math.min(allMin, s.arr, s.dep); allMax = Math.max(allMax, s.arr, s.dep); }));
const startMin = Math.floor(allMin/30)*30 - 15;
const endMin = Math.ceil(allMax/30)*30 + 15;

const plotW = (endMin - startMin) * PX_PER_MIN;
const plotH = KM_TOTAL * PX_PER_KM;
const svgW = MARGIN_L + plotW + MARGIN_R;
const svgH = MARGIN_T + plotH + MARGIN_B;

function xOf(min){ return MARGIN_L + (min - startMin) * PX_PER_MIN; }
function yOf(km){ return MARGIN_T + km * PX_PER_KM; }
function fmtTime(min){
  min = Math.round(min);
  let h = Math.floor(min/60), m = min%60;
  h = ((h % 24) + 24) % 24;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

// ---- build svg ----
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(svgNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const svg = el('svg', {width: svgW, height: svgH, viewBox: `0 0 ${svgW} ${svgH}`});

// vertical minute/hour grid
for(let m = Math.ceil(startMin/10)*10; m <= endMin; m += 10){
  const isHour = m % 60 === 0;
  const x = xOf(m);
  svg.appendChild(el('line', {x1:x, y1:MARGIN_T, x2:x, y2:MARGIN_T+plotH, class: isHour ? 'hour-line' : 'min-line'}));
  if(isHour){
    const lab1 = el('text', {x:x, y:MARGIN_T-10, class:'hour-label', 'text-anchor':'middle'});
    lab1.textContent = fmtTime(m);
    svg.appendChild(lab1);
    const lab2 = el('text', {x:x, y:MARGIN_T+plotH+20, class:'hour-label', 'text-anchor':'middle'});
    lab2.textContent = fmtTime(m);
    svg.appendChild(lab2);
  }
}

// horizontal station grid + labels
stations.forEach(s=>{
  const y = yOf(s.km);
  svg.appendChild(el('line', {x1:MARGIN_L, y1:y, x2:MARGIN_L+plotW, y2:y, class:'station-line'}));
  const lab = el('text', {x:MARGIN_L-12, y:y+4, class:'station-label', 'text-anchor':'end'});
  lab.textContent = s.name;
  svg.appendChild(lab);
});

// frame
svg.appendChild(el('line', {x1:MARGIN_L, y1:MARGIN_T, x2:MARGIN_L, y2:MARGIN_T+plotH, class:'hour-line'}));
svg.appendChild(el('line', {x1:MARGIN_L+plotW, y1:MARGIN_T, x2:MARGIN_L+plotW, y2:MARGIN_T+plotH, class:'hour-line'}));

const tooltip = document.getElementById('tooltip');

trains.forEach((t, idx)=>{
  const pts = [];
  t.stops.forEach(s=>{
    pts.push(`${xOf(s.arr)},${yOf(s.km)}`);
    if(s.dep !== s.arr) pts.push(`${xOf(s.dep)},${yOf(s.km)}`);
  });
  const colorVar = prefixColorVar[t.prefix] || '--text-faint';
  const path = el('polyline', {
    points: pts.join(' '),
    class: 'train-path',
    style: `stroke:var(${colorVar})`,
    'data-prefix': t.prefix,
    'data-checi': t.checi,
    'data-idx': idx
  });
  const hit = el('polyline', {
    points: pts.join(' '),
    class: 'train-hit',
    'data-idx': idx
  });
  svg.appendChild(path);
  svg.appendChild(hit);

  function showTip(e){
    const first = t.stops[0], last = t.stops[t.stops.length-1];
    let html = `<b>${t.checi}</b>  <span style="color:var(--text-dim);">(${prefixFull[t.prefix]||t.prefix})</span><br>`;
    html += `<span style="color:var(--text-faint); font-size:10px;">`;
    t.stops.forEach((s, i) => {
      if(i > 0) html += `<br>`;
      html += `${s.st} ${fmtTime(s.arr)} ⟶ ${fmtTime(s.dep)}`;
    });
    html += `</span>`;
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
    path.setAttribute('stroke-width', '3.4');
  }
  function hideTip(){
    tooltip.style.display = 'none';
    path.removeAttribute('stroke-width');
  }
  hit.addEventListener('mousemove', showTip);
  hit.addEventListener('mouseleave', hideTip);
  path.addEventListener('mousemove', showTip);
  path.addEventListener('mouseleave', hideTip);
});

document.getElementById('stage').appendChild(svg);

// ---- legend ----
const activePrefixes = new Set(['XT','SX','SDH','SF']);
const counts = {};
trains.forEach(t=> counts[t.prefix] = (counts[t.prefix]||0)+1);

const legend = document.getElementById('legend');
['XT','SX','SDH','SF'].forEach(p=>{
  if(!(p in counts)) return;
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.dataset.p = p;
  chip.innerHTML = `<span class="dot"></span>${p} · ${prefixFull[p]} <span class="count">(${counts[p]})</span>`;
  chip.addEventListener('click', ()=>{
    if(activePrefixes.has(p)){ activePrefixes.delete(p); chip.classList.remove('active'); }
    else { activePrefixes.add(p); chip.classList.add('active'); }
    applyFilters();
  });
  legend.appendChild(chip);
});

let searchTerm = '';
let dimOthers = true;

function applyFilters(){
  const term = searchTerm.trim().toUpperCase();
  const paths = svg.querySelectorAll('.train-path');
  paths.forEach(p=>{
    const idx = +p.dataset.idx;
    const t = trains[idx];
    const catOn = activePrefixes.has(t.prefix);
    p.classList.toggle('hidden-cat', !catOn);
    if(!catOn) { p.classList.remove('faded'); return; }
    if(term === ''){
      p.classList.remove('faded');
    } else {
      const match = t.checi.toUpperCase().includes(term);
      if(dimOthers) p.classList.toggle('faded', !match);
      else p.classList.remove('faded');
    }
  });
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  applyFilters();
});
document.getElementById('dimOthers').addEventListener('change', (e)=>{
  dimOthers = e.target.checked;
  applyFilters();
});

applyFilters();

// scroll to current time-ish default (start of data) on load, or just leave at left
document.getElementById('stage').style.height = (svgH + 4) + 'px';
</script>
